<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressum | Arthur Reznikov</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Mobile First Design */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
            background: #f8f9fa;
        }

        .container {
            padding: 1rem;
            max-width: 100%;
        }

        /* Header mit Back-Button */
        .impressum-header {
            position: sticky;
            top: 0;
            background: #2c3e50;
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .back-button {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .impressum-header h1 {
            margin: 0 auto;
            font-size: 1.2rem;
            transform: translateX(-0.5rem); /* Zentriert den Titel */
        }

        /* Impressum-Inhalt */
        main {
            padding: 1.5rem 1rem;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        p {
            margin-bottom: 1rem;
        }

        strong {
            color: #2c3e50;
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            body {
                background: #121212;
                color: #e0e0e0;
            }
            
            .impressum-header {
                background: #1a1a1a;
            }
            
            h1, strong {
                color: #e0e0e0;
            }
        }

        /* Desktop-Anpassungen */
        @media (min-width: 768px) {
            .container {
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
            }
            
            .impressum-header {
                padding: 1rem 2rem;
            }
            
            .back-button {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="impressum-header">
        <a href="javascript:history.back()" class="back-button">
            <i class="fas fa-arrow-left"></i> <span class="back-text">Zurück</span>
        </a>
        <h1>Impressum</h1>
    </header>

    <main class="container">
        <p><strong>Angaben gemäß §5 TMG:</strong></p>
        <p>
            Arthur Reznikov<br>
            Stettiner Str. 9<br>
            57072 Siegen<br>
            Deutschland
        </p>
        <p>
            <strong>Kontakt:</strong><br>
            E-Mail: arthur@resnikov oder bwb.reznikov@gmail.com<br>
            Telefon: +49 1515 6167643
        </p>
    </main>

    <script>
        // Verbessertes Back-Verhalten
        document.querySelector('.back-button').addEventListener('click', function(e) {
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        });

        // Verstecke Back-Text auf kleinen Screens
        if (window.innerWidth < 400) {
            document.querySelector('.back-text').style.display = 'none';
        }
    </script>
</body>
</html>
